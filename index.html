<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Currency Converter</title>
</head>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e3a8a, #2563eb);
    background-size: 300% 300%;
    animation: backgroundMove 8s ease infinite;
}

.container {
    width: 430px;
    padding: 35px;
    background: rgba(255, 255, 255, 0.96);
    border-radius: 24px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
    animation: cardAppear 0.8s ease;
    transition: 0.3s;
}

.container:hover {
    transform: translateY(-5px);
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.35);
}

.container h2 {
    text-align: center;
    color: #0f172a;
    font-size: 30px;
    margin-bottom: 30px;
    animation: titleAppear 1s ease;
}

.amount p,
.from p,
.to p {
    color: #475569;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 8px;
}

.amount input {
    width: 100%;
    height: 50px;
    padding: 0 16px;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    outline: none;
    font-size: 16px;
    color: #0f172a;
    transition: 0.3s;
}

.amount input:hover,
.amount input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    transform: scale(1.01);
}

.dropdown {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 25px;
}

.select-container {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px;
    background: #f8fafc;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    transition: 0.3s;
}

.select-container:hover {
    border-color: #2563eb;
    transform: translateY(-2px);
}

.select-container img {
    width: 34px;
    height: 25px;
    object-fit: cover;
    border-radius: 4px;
}

.select-container select {
    width: 85px;
    border: none;
    outline: none;
    background: transparent;
    color: #334155;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.dropdown i {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #eff6ff;
    color: #2563eb;
    font-size: 18px;
    cursor: pointer;
    transition: 0.4s;
}

.dropdown i:hover {
    background: #2563eb;
    color: white;
    transform: rotate(180deg);
}

.msg {
    margin: 28px 0 20px;
    padding: 14px;
    text-align: center;
    background: #eff6ff;
    color: #1d4ed8;
    border-radius: 12px;
    font-weight: bold;
    border: 1px solid #dbeafe;
    animation: messagePulse 2s ease-in-out infinite;
}

button {
    width: 100%;
    height: 52px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: 0.3s;
}

button:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
}

button:active {
    transform: scale(0.97);
}

button::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 70%;
    height: 100%;
    background: rgba(255, 255, 255, 0.2);
    transform: skewX(-25deg);
    transition: 0.5s;
}

button:hover::before {
    left: 130%;
}

@keyframes backgroundMove {
    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}

@keyframes cardAppear {
    from {
        opacity: 0;
        transform: translateY(40px) scale(0.95);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes titleAppear {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes messagePulse {
    0%,
    100% {
        box-shadow: 0 0 0 rgba(37, 99, 235, 0);
    }

    50% {
        box-shadow: 0 0 15px rgba(37, 99, 235, 0.15);
    }
}

@media (max-width: 500px) {
    .container {
        width: 90%;
        padding: 25px;
    }

    .dropdown {
        gap: 6px;
    }

    .select-container select {
        width: 65px;
    }
}
</style>
<body>
  <div class="container">
      <h2>Currency Converter</h2>
      <form>
        <div class="amount">
            <p>Enter Amount</p>
            <input value="100" type="text"/>
        </div>
        <div class="dropdown">
            <div class="from">
                <p>From</p>
                <div class="select-container">
                    <img src="https://flagsapi.com/US/flat/64.png">
                    <select name="from"> </select>
                </div>
            </div>
            <i class="fa-solid fa-arrow-right-arrow-left"></i>
            <div class="to">
                <p>to</p>
                <div class="select-container">
                    <img src="https://flagsapi.com/IN/flat/64.png">
                    <select name="to"></select>
                </div>
            </div>
        </div>
        <div class="msg">1USD = 90INR</div>
        <button>Get Exchange Rate</button>
      </form>
  </div>
  <script src="codes.js"></script>
  <script src="app.js"></script>
</body>
</html>

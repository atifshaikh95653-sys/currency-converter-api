<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Login Signup Animation</title>
</head>
<body>

  <div class="container">

    <div class="form-box login animation">
      <h2>Login</h2>
      <input type="text" placeholder="Username">
      <input type="password" placeholder="Password">
      <button class="btn">Login</button>
      <p>Don't have an account? <span id="goSignup">Sign Up</span></p>
    </div>

    <div class="form-box register animation">
      <h2>Sign Up</h2>
      <input type="text" placeholder="Username">
      <input type="email" placeholder="Email">
      <input type="password" placeholder="Password">
      <button class="btn">Register</button>
      <p>Already have an account? <span id="goLogin">Login</span></p>
    </div>

    <div class="side-box">
      <h1>WELCOME BACK!</h1>
      <p>We are happy to have you again.</p>
    </div>

  </div>

  <script src="code.js"></script>
</body>
</html>
